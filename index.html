
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 20px auto;
      padding: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
    }
    button { cursor: pointer; }
    #reader { width: 100%; margin-top: 12px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>SAP B1 QR Scanner</h2>
  <p>Scan the Crystal Reports QR code to open the pre-filled Google Form.</p>

  <button onclick="startScanner()">Start QR Scanner</button>
  <div id="reader"></div>

  <h3>Or enter scanned QR text</h3>
  <input id="qrText"
    placeholder="CardCode=C20001;CardName=ABC Trading LLC">
  <button onclick="processQR(document.getElementById('qrText').value)">
    Open Google Form
  </button>

  <p id="status" role="status"></p>

  <script>
    // REPLACE THESE VALUES WITH YOUR ACTUAL GOOGLE FORM DETAILS.
    const FORM_BASE =
      'https://docs.google.com/forms/d/e/1FAIpQLSd7JMDBmM-tepHj3LMQMH6qe2HyA0gabmplcG1UnDgC2w2xtw/viewform';

    const CARDCODE_ENTRY = 'entry.222688078';
    const CARDNAME_ENTRY = 'entry.2091106023';

    let scanner = null;
    let handled = false;

    function processQR(raw) {
      const status = document.getElementById('status');
      status.textContent = '';

      // Expected format:
      // CardCode=C20001;CardName=ABC Trading LLC
      const fields = {};

      raw.split(';').forEach(part => {
        const i = part.indexOf('=');
        if (i < 0) return;

        const key = part.slice(0, i).trim().toLowerCase();
        const value = part.slice(i + 1).trim();
        fields[key] = value;
      });

      const cardCode = fields.cardcode;
      const cardName = fields.cardname;

      if (!cardCode || !cardName) {
        status.textContent =
          'Invalid QR data. CardCode or CardName is missing.';
        return;
      }

      const url = new URL(FORM_BASE);
      url.searchParams.set('usp', 'pp_url');
      url.searchParams.set(CARDCODE_ENTRY, cardCode);
      url.searchParams.set(CARDNAME_ENTRY, cardName);

      status.textContent = 'Opening Google Form...';
      window.top.location.href = url.toString();
    }

    async function startScanner() {
      const status = document.getElementById('status');

      if (typeof Html5Qrcode === 'undefined') {
        status.textContent =
          'Scanner library did not load. Check your internet connection.';
        return;
      }

      try {
        handled = false;
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async decodedText => {
            if (handled) return;
            handled = true;

            try {
              await scanner.stop();
            } catch (e) {}

            processQR(decodedText);
          },
          () => {}
        );
      } catch (e) {
        status.textContent =
          'Could not start the camera. Allow camera access or paste the QR text above. ' +
          e.message;
      }
    }
  </script>
</body>
</html>
