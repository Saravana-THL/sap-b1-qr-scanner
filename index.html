<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP B1 Customer QR Feedback</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    #reader { width: 100%; }
    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <h2>SAP B1 Customer QR Feedback</h2>

  <p id="status">Checking QR Code details...</p>

  <button id="startButton" onclick="startScanner()" hidden>
    Start Scanner
  </button>

  <div id="reader"></div>

  <script>
    const FORM_BASE =
      'https://docs.google.com/forms/d/e/1FAIpQLSd7JMDBmM-tepHj3LMQMH6qe2HyA0gabmplcG1UnDgC2w2xtw/viewform';

    const CARDCODE_ENTRY = 'entry.222688078';
    const CARDNAME_ENTRY = 'entry.2091106023';

    let scanner;
    let busy = false;

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    // Read customer details directly from the GitHub URL.
    function processPageUrl() {
      const params = new URLSearchParams(window.location.search);

      const cardCode = params.get('cardCode');
      const cardName = params.get('cardName');

      if (cardCode && cardName) {
        openGoogleForm(cardCode, cardName);
        return;
      }

      // No customer parameters: retain the camera scanner.
      setStatus(
        'No customer details found in the URL. ' +
        'You can scan a QR Code using the camera below.'
      );

      document.getElementById('startButton').hidden = false;
    }

    function openGoogleForm(cardCode, cardName) {
      if (!cardCode || !cardName) {
        setStatus('CardCode or CardName is missing.');
        return;
      }

      try {
        const url = new URL(FORM_BASE);

        url.searchParams.set('usp', 'pp_url');
        url.searchParams.set(CARDCODE_ENTRY, cardCode);
        url.searchParams.set(CARDNAME_ENTRY, cardName);

        setStatus('Opening Google Form...');

        // Automatically open the prefilled Google Form.
        window.location.replace(url.toString());
      } catch (error) {
        setStatus('Unable to open Google Form: ' + error.message);
      }
    }

    async function startScanner() {
      const button = document.getElementById('startButton');
      button.disabled = true;

      try {
        if (typeof Html5Qrcode === 'undefined') {
          throw new Error('QR scanner library failed to load.');
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            'Camera access is unavailable. Open the HTTPS website.'
          );
        }

        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        busy = false;
        setStatus('Starting camera...');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.85
              );
              return { width: size, height: size };
            },
            aspectRatio: 1.0
          },
          async function(decodedText) {
            if (busy) return;
            busy = true;

            try {
              await scanner.stop();
            } catch (e) {}

            // Scanner fallback accepts a URL or
            // CardCode=C0001;CardName=ABC Trading.
            try {
              const scannedUrl = new URL(decodedText);

              const code = scannedUrl.searchParams.get('cardCode');
              const name = scannedUrl.searchParams.get('cardName');

              if (code && name) {
                openGoogleForm(code, name);
                return;
              }
            } catch (e) {}

            const fields = {};

            decodedText.split(/[;\r\n]+/).forEach(part => {
              const i = part.indexOf('=');
              if (i < 0) return;

              fields[part.slice(0, i).trim().toLowerCase()] =
                part.slice(i + 1).trim();
            });

            if (fields.cardcode && fields.cardname) {
              openGoogleForm(fields.cardcode, fields.cardname);
            } else {
              setStatus(
                'QR detected, but CardCode or CardName is missing.\n' +
                decodedText
              );
              busy = false;
              button.disabled = false;
            }
          },
          function() {}
        );

        setStatus('Camera started. Point it at the QR Code.');

      } catch (error) {
        setStatus('Scanner error: ' + error.message);
        button.disabled = false;
      }
    }

    // Run automatically when the page loads.
    processPageUrl();
  </script>
</body>
</html>
