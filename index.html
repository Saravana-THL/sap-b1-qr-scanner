
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP B1 Customer QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }
    button, input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    #reader { width: 100%; }
    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <h2>SAP B1 Customer QR Scanner</h2>

  <button id="startButton" onclick="startScanner()">
    Start Scanner
  </button>

  <div id="reader"></div>
  <p id="status">Ready to scan.</p>

  <script>
    // Replace with your actual Google Form details.
    const FORM_BASE =
      'https://docs.google.com/forms/d/e/1FAIpQLSd7JMDBmM-tepHj3LMQMH6qe2HyA0gabmplcG1UnDgC2w2xtw/viewform';

    const CARDCODE_ENTRY = 'entry.222688078';
    const CARDNAME_ENTRY = 'entry.2091106023';

    let scanner;
    let busy = false;

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    async function startScanner() {
      const button = document.getElementById('startButton');
      button.disabled = true;

      try {
        if (typeof Html5Qrcode === 'undefined') {
          throw new Error(
            'QR scanner library failed to load. Check internet access.'
          );
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            'Camera access is unavailable. Open the HTTPS website in Chrome.'
          );
        }

        if (scanner) {
          try {
            await scanner.stop();
          } catch (e) {}
          try {
            scanner.clear();
          } catch (e) {}
        }

        busy = false;
        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        setStatus('Starting camera...');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.85
              );
              return { width: size, height: size };
            },
            aspectRatio: 1.0,
            disableFlip: false
          },
          async function(decodedText) {
            if (busy) return;
            busy = true;

            setStatus('QR detected!\nData: ' + decodedText);

            try {
              await scanner.stop();
            } catch (e) {}

            openGoogleForm(decodedText);
          },
          function() {
            // No QR detected in this frame; continue scanning.
          }
        );

        setStatus(
          'Camera started. Hold the QR code steady inside the box. ' +
          'Move closer or farther away until it is in focus.'
        );

      } catch (error) {
        setStatus('Scanner error: ' + error.message);
        button.disabled = false;
      }
    }

    function openGoogleForm(raw) {
      const fields = {};

      raw.split(/[;\r\n]+/).forEach(part => {
        const i = part.indexOf('=');
        if (i < 0) return;

        const key = part.slice(0, i).trim().toLowerCase();
        const value = part.slice(i + 1).trim();

        fields[key] = value;
      });

      const cardCode = fields.cardcode;
      const cardName = fields.cardname;

      if (!cardCode || !cardName) {
        setStatus(
          'QR detected, but CardCode or CardName is missing.\n' +
          'Decoded data: ' + raw
        );
        busy = false;
        document.getElementById('startButton').disabled = false;
        return;
      }

      try {
        const url = new URL(FORM_BASE);
        url.searchParams.set('usp', 'pp_url');
        url.searchParams.set(CARDCODE_ENTRY, cardCode);
        url.searchParams.set(CARDNAME_ENTRY, cardName);

        setStatus(
          'CardCode: ' + cardCode +
          '\nCardName: ' + cardName +
          '\nOpening Google Form...'
        );

        window.location.href = url.toString();
      } catch (error) {
        setStatus('Unable to open form: ' + error.message);
        busy = false;
        document.getElementById('startButton').disabled = false;
      }
    }
  </script>
</body>
</html>
