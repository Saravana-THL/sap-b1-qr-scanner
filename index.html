
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP B1 Customer QR Feedback</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    #reader { width: 100%; }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <h2>SAP B1 Customer QR Feedback</h2>

  <p id="status">Checking QR Code details...</p>

  <button id="startButton" onclick="startScanner()" hidden>
    Start Scanner
  </button>

  <div id="reader"></div>

  <script>
    // Microsoft Forms base URL
    const FORM_BASE = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx';

    const FORM_ID = 'SW_cn5vKT0Gvc1hx-5gtamCER4UFLLRHmsQbN0WcvppURE1VSlo0OFNQM0I3STRIT0pZWlgwOUhUOS4u';

    // Microsoft Forms pre-filled question parameters
    const CARDCODE_ENTRY = 'r68452014633b4c96bf6f9b0e968d7e32';

    const CARDNAME_ENTRY = 'r5cd0142f11ee41b6815f5c6ff9a68828';

    // Feedback remains blank for the customer
    let scanner;
    let busy = false;

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    // Read customer details from the page URL
    function processPageUrl() {
      const params = new URLSearchParams(
        window.location.search
      );

      const cardCode = params.get('cardCode');
      const cardName = params.get('cardName');

      if (cardCode && cardName) {
        openMicrosoftForm(cardCode, cardName);
        return;
      }

      setStatus(
        'Scan the customer QR Code using the camera below.'
      );

      document.getElementById('startButton').hidden = false;
    }

    // Build the Microsoft Forms pre-filled URL
    function openMicrosoftForm(cardCode, cardName) {
      if (!cardCode || !cardName) {
        setStatus('Customer Code or Customer Name is missing.');
        return;
      }

      try {
        const url = new URL(FORM_BASE);

        url.searchParams.set('id', FORM_ID);
        url.searchParams.set(CARDCODE_ENTRY, cardCode);
        url.searchParams.set(CARDNAME_ENTRY, cardName);

        setStatus(
          'Opening Microsoft Forms for ' + cardCode + '...'
        );

        window.location.assign(url.toString());

      } catch (error) {
        setStatus(
          'Unable to open Microsoft Forms: ' + error.message
        );
      }
    }

    async function startScanner() {
      const button = document.getElementById('startButton');
      button.disabled = true;

      try {
        if (typeof Html5Qrcode === 'undefined') {
          throw new Error('QR scanner library failed to load.');
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            'Camera access is unavailable. Open the HTTPS website.'
          );
        }

        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        busy = false;

        setStatus('Starting camera...');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.85
              );

              return { width: size, height: size };
            },
            aspectRatio: 1.0
          },

          async function(decodedText) {
            if (busy) return;
            busy = true;

            try {
              await scanner.stop();
            } catch (e) {}

            let code = null;
            let name = null;

            // QR containing a URL with cardCode/cardName
            try {
              const scannedUrl = new URL(decodedText);

              code = scannedUrl.searchParams.get('cardCode');
              name = scannedUrl.searchParams.get('cardName');

            } catch (e) {}

            // QR containing CardCode=C0001;CardName=ABC Trading
            if (!code || !name) {
              const fields = {};

              decodedText.split(/[;\r\n]+/).forEach(part => {
                const i = part.indexOf('=');

                if (i < 0) return;

                fields[
                  part.slice(0, i).trim().toLowerCase()
                ] = part.slice(i + 1).trim();
              });

              code = fields.cardcode || null;
              name = fields.cardname || null;
            }

            if (code && name) {
              openMicrosoftForm(code, name);
            } else {
              setStatus(
                'QR detected, but Customer Code or Customer Name ' +
                'is missing.\n' + decodedText
              );

              busy = false;
              button.disabled = false;
            }
          },

          function() {}
        );

        setStatus(
          'Camera started. Point it at the customer QR Code.'
        );

      } catch (error) {
        setStatus('Scanner error: ' + error.message);
        button.disabled = false;
      }
    }

    // Run automatically when the page loads
    processPageUrl();
  </script>
</body>
</html>
